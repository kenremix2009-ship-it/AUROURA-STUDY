<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FL Studio 21 Web DAW - Pro Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --daw-bg: #16191c;
      --daw-header: #24292e;
      --daw-panel: #1e2226;
      --daw-border: #2e353c;
      --daw-border-dark: #121416;
      --daw-track-bg: #1c2024;
      --daw-track-alt: #191c20;
      --daw-text: #a6b2be;
      --daw-accent: #d37a1f; /* Cam đất mờ truyền thống của DAW */
      --daw-led: #4cd964;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      margin: 0;
      background-color: var(--daw-bg);
      color: var(--daw-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Thanh cuộn tối giản */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--daw-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #363e46;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4a545e;
    }

    /* Lưới Playlist tối giản chuyên nghiệp */
    .playlist-grid {
      background-color: var(--daw-track-bg);
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.3) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, var(--daw-border-dark) 1px, transparent 1px);
      background-size: 160px 100%, 40px 100%, 100% 32px;
    }

    /* Đèn LED xanh cơ bản */
    .track-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--daw-led);
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(76, 217, 100, 0.4);
    }
    .track-led.off {
      background: #252b30;
      box-shadow: none;
    }

    /* Playhead line tăng tốc GPU */
    #playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 1px;
      background-color: var(--daw-accent);
      pointer-events: none;
      z-index: 50;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    #playhead::after {
      content: '';
      position: absolute;
      top: 0;
      left: -4px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--daw-accent);
    }

    /* Thanh trượt volume mỏng */
    input[type=range].mini-slider {
      -webkit-appearance: none;
      background: #111416;
      height: 3px;
      border-radius: 1px;
      border: 1px solid #283038;
      outline: none;
    }
    input[type=range].mini-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b99a6;
      cursor: pointer;
      border: 1px solid #111;
    }
    input[type=range].mini-slider::-webkit-slider-thumb:hover {
      background: var(--daw-accent);
    }

    /* Clip khối âm thanh trên lưới */
    .daw-clip {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 2px;
      background: #283138;
      border: 1px solid #3c4752;
      overflow: hidden;
      cursor: move;
      display: flex;
      flex-direction: column;
    }
    .daw-clip.selected {
      border-color: var(--daw-accent);
      box-shadow: 0 0 0 1px var(--daw-accent);
    }
    .daw-clip-header {
      height: 12px;
      line-height: 12px;
      font-size: 9px;
      padding: 0 4px;
      background: rgba(0, 0, 0, 0.4);
      color: #c0cad3;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. TOP TRANSPORT BAR (TỐI GIẢN) ==================== -->
  <header class="h-9 bg-[#21262b] border-b border-[#131618] px-2 flex items-center justify-between gap-3 shrink-0 z-30">
    
    <!-- Cụm Menu cơ bản -->
    <div class="flex items-center gap-3">
      <div class="font-bold text-[10px] text-slate-400 flex items-center gap-2">
        <span class="text-white px-1.5 py-0.5 bg-[#2a3138] rounded">FL STUDIO</span>
        <span class="hover:text-white cursor-pointer">FILE</span>
        <span class="hover:text-white cursor-pointer">EDIT</span>
        <span class="hover:text-white cursor-pointer">VIEW</span>
        <span class="hover:text-white cursor-pointer">OPTIONS</span>
      </div>

      <div class="h-3 w-px bg-slate-700"></div>

      <!-- Đổi tên dự án: Shift + Click -->
      <div id="projectTitle" class="text-[11px] font-mono text-slate-300 font-semibold truncate max-w-[200px] cursor-pointer hover:underline" title="Nhấn Shift + Click để đổi tên">
        Untitled_Session_01
      </div>
    </div>

    <!-- Cụm Playback chính -->
    <div class="flex items-center gap-2 bg-[#171a1d] px-2 py-0.5 rounded border border-[#272e35]">
      <!-- Nút Play -->
      <button id="btnPlay" class="w-6 h-6 rounded bg-[#252c32] hover:bg-[#303840] flex items-center justify-center text-slate-200" title="Play / Pause (Space)">
        <svg id="playIcon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>

      <!-- Nút Stop -->
      <button id="btnStop" class="w-6 h-6 rounded bg-[#252c32] hover:bg-[#303840] flex items-center justify-center text-slate-300" title="Stop">
        <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg>
      </button>

      <!-- Đồng hồ LCD tối giản: Bar & Time -->
      <div class="font-mono text-xs px-2 py-0.5 bg-[#0f1214] border border-[#22272c] rounded text-slate-300 flex gap-2">
        <span id="lcdBar" class="text-slate-500 font-bold">01:01</span>
        <span id="lcdTime" class="text-[#d08b38] font-bold">00:00.0</span>
      </div>

      <!-- BPM -->
      <div class="flex items-center gap-1 font-mono text-[10px] text-slate-400 px-1">
        <span>BPM</span>
        <span class="bg-[#0f1214] px-1 py-0.5 rounded border border-[#22272c] text-slate-200">130.0</span>
      </div>

      <!-- Master Volume -->
      <div class="flex items-center gap-1.5 pl-1 border-l border-slate-700">
        <span class="text-[9px] text-slate-500 font-mono">VOL</span>
        <input id="masterVol" type="range" min="0" max="1" step="0.01" value="0.9" class="mini-slider w-14" />
      </div>
    </div>

    <!-- Cụm Hành động: Import không giới hạn, Thêm Track & Export -->
    <div class="flex items-center gap-1.5">
      <label for="fileLoader" class="px-2 py-1 rounded bg-[#2a3138] hover:bg-[#343d46] text-slate-200 font-semibold text-[10px] cursor-pointer border border-[#3f4a54]">
        + Load Audio (300MB+ OK)
      </label>
      <input id="fileLoader" type="file" accept="audio/*" class="hidden" />

      <button id="btnAddTrack" class="px-2 py-1 rounded bg-[#2a3138] hover:bg-[#343d46] text-slate-300 text-[10px] border border-[#3f4a54]">
        + Add Track
      </button>

      <button id="btnExport" class="px-2 py-1 rounded bg-[#2e3740] hover:bg-[#394450] text-[#d08b38] font-semibold text-[10px] border border-[#485663]">
        Export WAV
      </button>
    </div>
  </header>

  <!-- ==================== 2. KHU VỰC PLAYLIST ARRANGEMENT ==================== -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Cột Headers bên trái -->
    <div class="w-48 bg-[#1a1e22] border-r border-[#121416] flex flex-col shrink-0">
      <div class="h-6 bg-[#21262a] border-b border-[#121416] px-2 flex items-center justify-between text-[9px] font-bold text-slate-400">
        <span>TRACK NAME (SHIFT+CLICK)</span>
        <span>VOL / MUTE</span>
      </div>
      <div id="trackHeadersList" class="flex-1 overflow-y-auto divide-y divide-[#131618]">
        <!-- Sinh tự động bằng JS -->
      </div>
    </div>

    <!-- Vùng Lưới Arrangement bên phải -->
    <div class="flex-1 flex flex-col overflow-hidden bg-daw-bg">
      
      <!-- Thước đo Ruler (Click để tua) -->
      <div id="rulerTimeline" class="h-6 bg-[#181c20] border-b border-[#121416] relative overflow-hidden cursor-pointer select-none">
        <div id="rulerTicks" class="absolute inset-0 flex items-center pointer-events-none"></div>
      </div>

      <!-- Vùng cuộn chứa các Track Lanes -->
      <div id="playlistLanes" class="flex-1 overflow-y-auto overflow-x-hidden relative playlist-grid select-none">
        <div id="lanesContainer" class="w-full relative">
          <!-- Các Lane tương ứng từng Track -->
        </div>

        <!-- Playhead GPU -->
        <div id="playhead"></div>
      </div>

    </div>
  </div>

  <!-- Audio Element ẩn phục vụ Streaming file lớn (300MB, 1GB+) tức thì không tốn RAM -->
  <audio id="streamAudio" preload="auto" class="hidden"></audio>

  <!-- ==================== 3. JAVASCRIPT CORE ==================== -->
  <script>
    /**
     * DỮ LIỆU CÁC TRACK MẶC ĐỊNH (TỐI GIẢN, KHÔNG MÀU MÈ)
     */
    let tracks = [
      { id: 'tr_1', name: '01 - Master Audio', type: 'audio', volume: 0.9, muted: false, soloed: false, clips: [] },
      { id: 'tr_2', name: '02 - Kick / Perc',   type: 'drums', volume: 0.85, muted: false, soloed: false, clips: [] },
      { id: 'tr_3', name: '03 - 808 Bass',     type: 'bass',  volume: 0.85, muted: false, soloed: false, clips: [] },
      { id: 'tr_4', name: '04 - Vocals / Synth',type: 'vocal', volume: 0.85, muted: false, soloed: false, clips: [] },
      { id: 'tr_5', name: '05 - Arrangement',  type: 'synth', volume: 0.85, muted: false, soloed: false, clips: [] }
    ];

    let audioCtx = null;
    let streamSource = null;
    let masterGain = null;
    let bassFilter = null;
    let isPlaying = false;
    let duration = 30.0;
    let selectedClipId = null;

    // DOM Elements
    const audioEl = document.getElementById('streamAudio');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const playIcon = document.getElementById('playIcon');
    const playhead = document.getElementById('playhead');
    const lcdTime = document.getElementById('lcdTime');
    const lcdBar = document.getElementById('lcdBar');
    const masterVol = document.getElementById('masterVol');
    const fileLoader = document.getElementById('fileLoader');
    const trackHeadersList = document.getElementById('trackHeadersList');
    const lanesContainer = document.getElementById('lanesContainer');
    const rulerTimeline = document.getElementById('rulerTimeline');
    const rulerTicks = document.getElementById('rulerTicks');
    const projectTitle = document.getElementById('projectTitle');
    const btnAddTrack = document.getElementById('btnAddTrack');
    const btnExport = document.getElementById('btnExport');

    window.addEventListener('DOMContentLoaded', () => {
      initRuler();
      renderTracksUI();
      setupEvents();
      createDefaultDemoClips();
    });

    /**
     * 1. KHỞI TẠO RULER ĐƠN GIẢN
     */
    function initRuler() {
      rulerTicks.innerHTML = '';
      const totalBars = 32;
      for (let i = 1; i <= totalBars; i++) {
        const tick = document.createElement('div');
        tick.style.width = `${100 / totalBars}%`;
        tick.className = 'h-full border-l border-[#272f36] pl-1 font-mono text-[9px] text-slate-500 flex items-center';
        tick.textContent = i;
        rulerTicks.appendChild(tick);
      }
    }

    /**
     * 2. RENDER GIAO DIỆN TRACK HEADERS & LANES (GỌN GÀNG, KHÔNG MÀU MÈ)
     */
    function renderTracksUI() {
      trackHeadersList.innerHTML = '';
      lanesContainer.innerHTML = '';

      tracks.forEach((track, idx) => {
        // Track Header (Bên trái)
        const header = document.createElement('div');
        header.className = 'h-[32px] px-2 flex items-center justify-between bg-[#1d2125] hover:bg-[#22272c] border-b border-[#131618]';
        header.innerHTML = `
          <div class="flex items-center gap-1.5 min-w-0 pr-1">
            <span class="track-led ${track.muted ? 'off' : ''}" data-id="${track.id}" title="Mute Track"></span>
            <span class="track-title font-medium text-[10px] text-slate-300 truncate cursor-pointer" data-id="${track.id}" title="Shift + Click để đổi tên">
              ${track.name}
            </span>
          </div>
          <div class="flex items-center gap-1.5">
            <input type="range" min="0" max="1" step="0.01" value="${track.volume}" data-id="${track.id}" class="track-vol mini-slider w-10" title="Volume" />
            <button data-id="${track.id}" class="btn-del-track text-slate-500 hover:text-rose-400 font-bold text-xs px-1 leading-none" title="Xóa Track này">×</button>
          </div>
        `;
        trackHeadersList.appendChild(header);

        // Track Lane (Bên phải)
        const lane = document.createElement('div');
        lane.className = 'h-[32px] relative w-full border-b border-[#131618]';
        lane.dataset.trackId = track.id;

        // Render các clip thuộc track này
        track.clips.forEach(clip => {
          const clipEl = document.createElement('div');
          clipEl.id = clip.id;
          clipEl.className = `daw-clip ${clip.id === selectedClipId ? 'selected' : ''}`;
          clipEl.style.left = `${clip.startPct}%`;
          clipEl.style.width = `${clip.widthPct}%`;
          clipEl.innerHTML = `
            <div class="daw-clip-header">
              <span class="clip-title" data-id="${clip.id}">${clip.name}</span>
              <span class="text-[8px] text-slate-400 font-mono">${clip.type.toUpperCase()}</span>
            </div>
            <div class="flex-1 opacity-40 bg-[repeating-linear-gradient(90deg,#8b99a6_0px,#8b99a6_1px,transparent_1px,transparent_8px)]"></div>
          `;
          lane.appendChild(clipEl);
        });

        lanesContainer.appendChild(lane);
      });
    }

    /**
     * 3. XỬ LÝ STREAMING ÂM THANH FILE LỚN (300MB+ KHÔNG BỊ TREO RAM)
     */
    function initWebAudioStream() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        streamSource = audioCtx.createMediaElementSource(audioEl);

        // Bộ lọc Bass cơ bản
        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowpass';
        bassFilter.frequency.value = 20000; // Mặc định mở toàn dải

        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(masterVol.value);

        streamSource.connect(bassFilter);
        bassFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function loadLargeAudioFile(file) {
      if (!file) return;
      initWebAudioStream();

      // Sử dụng trực tiếp Object URL để stream, không gọi decodeAudioData gây tràn RAM với file 300MB
      const objectUrl = URL.createObjectURL(file);
      audioEl.src = objectUrl;
      audioEl.load();

      audioEl.onloadedmetadata = () => {
        duration = audioEl.duration || 30.0;
        document.getElementById('projectTitle').textContent = file.name;

        // Tự động gán 1 clip đại diện cho toàn bộ bài hát vào Track 1
        tracks[0].clips = [{
          id: 'clip_master',
          trackId: tracks[0].id,
          name: file.name,
          type: 'audio',
          startPct: 0,
          widthPct: 100
        }];
        renderTracksUI();
        updateTimeUI(0);
      };
    }

    /**
     * 4. PLAY / PAUSE / STOP & PLAYHEAD ENGINE (SIÊU NHẸ)
     */
    function togglePlay() {
      initWebAudioStream();
      if (isPlaying) {
        audioEl.pause();
        isPlaying = false;
      } else {
        audioEl.play().catch(() => {});
        isPlaying = true;
        requestAnimationFrame(updateLoop);
      }
      updatePlayBtnUI();
    }

    function stopPlayback() {
      audioEl.pause();
      audioEl.currentTime = 0;
      isPlaying = false;
      updateTimeUI(0);
      updatePlayBtnUI();
    }

    function updateLoop() {
      if (!isPlaying) return;
      const current = audioEl.currentTime || 0;
      updateTimeUI(current);
      requestAnimationFrame(updateLoop);
    }

    function updateTimeUI(sec) {
      const containerWidth = lanesContainer.clientWidth || 800;
      const progress = duration > 0 ? (sec / duration) : 0;
      const x = progress * containerWidth;

      // Di chuyển playhead
      playhead.style.transform = `translate3d(${x.toFixed(1)}px, 0, 0)`;

      // Cập nhật LCD
      const mins = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ds = Math.floor((sec % 1) * 10);
      lcdTime.textContent = `${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ds}`;

      const bar = Math.floor((sec / (duration || 30)) * 32) + 1;
      lcdBar.textContent = `${String(bar).padStart(2, '0')}:01`;
    }

    function updatePlayBtnUI() {
      if (isPlaying) {
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        playIcon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
      }
    }

    /**
     * 5. KÉO THẢ DI CHUYỂN CLIP TRÊN LƯỚI & CHỌN/XÓA CLIP
     */
    let draggedClip = null;
    let dragStartX = 0;
    let initialStartPct = 0;

    function setupDragAndDropClips() {
      lanesContainer.addEventListener('mousedown', (e) => {
        const clipEl = e.target.closest('.daw-clip');
        if (!clipEl) {
          selectedClipId = null;
          document.querySelectorAll('.daw-clip').forEach(c => c.classList.remove('selected'));
          return;
        }

        selectedClipId = clipEl.id;
        document.querySelectorAll('.daw-clip').forEach(c => c.classList.remove('selected'));
        clipEl.classList.add('selected');

        // Tìm clip trong dữ liệu
        let foundClip = null;
        tracks.forEach(t => {
          const c = t.clips.find(item => item.id === clipEl.id);
          if (c) foundClip = c;
        });

        if (foundClip) {
          draggedClip = foundClip;
          dragStartX = e.clientX;
          initialStartPct = foundClip.startPct;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!draggedClip) return;
        const containerWidth = lanesContainer.clientWidth || 800;
        const deltaX = e.clientX - dragStartX;
        const deltaPct = (deltaX / containerWidth) * 100;
        
        // Cập nhật vị trí mới (giới hạn từ 0% đến 100% - widthPct)
        let newPct = initialStartPct + deltaPct;
        newPct = Math.max(0, Math.min(newPct, 100 - draggedClip.widthPct));
        draggedClip.startPct = newPct;

        const el = document.getElementById(draggedClip.id);
        if (el) el.style.left = `${newPct.toFixed(2)}%`;
      });

      window.addEventListener('mouseup', () => {
        draggedClip = null;
      });

      // Xóa Clip khi nhấn phím Delete hoặc Backspace
      window.addEventListener('keydown', (e) => {
        if ((e.code === 'Delete' || e.code === 'Backspace') && selectedClipId && e.target.tagName !== 'INPUT') {
          tracks.forEach(t => {
            t.clips = t.clips.filter(c => c.id !== selectedClipId);
          });
          selectedClipId = null;
          renderTracksUI();
        }
      });
    }

    /**
     * 6. BẤM SHIFT + CHUỘT TRÁI ĐỂ ĐỔI TÊN TRỰC TIẾP TẠI CHỖ
     */
    function setupInlineRename() {
      // Đổi tên dự án ở Top Bar
      projectTitle.addEventListener('click', (e) => {
        if (e.shiftKey) {
          inlineEdit(projectTitle, (newVal) => {
            projectTitle.textContent = newVal || 'Untitled_Project';
          });
        }
      });

      // Đổi tên Track hoặc Clip
      document.body.addEventListener('click', (e) => {
        if (!e.shiftKey) return;

        // Đổi tên Track
        const trackTitleEl = e.target.closest('.track-title');
        if (trackTitleEl) {
          const id = trackTitleEl.dataset.id;
          const track = tracks.find(t => t.id === id);
          if (track) {
            inlineEdit(trackTitleEl, (newVal) => {
              track.name = newVal || track.name;
              renderTracksUI();
            });
          }
          return;
        }

        // Đổi tên Clip
        const clipTitleEl = e.target.closest('.clip-title');
        if (clipTitleEl) {
          const id = clipTitleEl.dataset.id;
          let clip = null;
          tracks.forEach(t => {
            const c = t.clips.find(x => x.id === id);
            if (c) clip = c;
          });
          if (clip) {
            inlineEdit(clipTitleEl, (newVal) => {
              clip.name = newVal || clip.name;
              renderTracksUI();
            });
          }
        }
      });
    }

    function inlineEdit(targetEl, onSave) {
      const currentText = targetEl.textContent.trim();
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentText;
      input.className = 'bg-[#111417] text-white border border-[#d37a1f] px-1 py-0 text-[10px] rounded outline-none';
      
      const save = () => {
        const val = input.value.trim();
        targetEl.textContent = val || currentText;
        if (onSave) onSave(val);
      };

      input.addEventListener('blur', save);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          input.blur();
        } else if (e.key === 'Escape') {
          targetEl.textContent = currentText;
          input.remove();
        }
      });

      targetEl.textContent = '';
      targetEl.appendChild(input);
      input.focus();
      input.select();
    }

    /**
     * 7. TẠO CLIPS MẪU BAN ĐẦU
     */
    function createDefaultDemoClips() {
      tracks[1].clips = [
        { id: 'clip_kick_1', trackId: 'tr_2', name: 'Kick_Pattern_01', type: 'drums', startPct: 0, widthPct: 25 },
        { id: 'clip_kick_2', trackId: 'tr_2', name: 'Kick_Pattern_02', type: 'drums', startPct: 50, widthPct: 25 }
      ];
      tracks[2].clips = [
        { id: 'clip_bass_1', trackId: 'tr_3', name: 'Dior_808_A#', type: 'bass', startPct: 0, widthPct: 50 }
      ];
      tracks[3].clips = [
        { id: 'clip_voc_1', trackId: 'tr_4', name: 'Lead_Vocal_Loop', type: 'vocal', startPct: 25, widthPct: 50 }
      ];
      renderTracksUI();
    }

    /**
     * 8. ĐĂNG KÝ SỰ KIỆN GIAO DIỆN
     */
    function setupEvents() {
      btnPlay.addEventListener('click', togglePlay);
      btnStop.addEventListener('click', stopPlayback);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlay();
        }
      });

      // Master Volume
      masterVol.addEventListener('input', (e) => {
        if (masterGain && audioCtx) {
          masterGain.gain.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.02);
        }
      });

      // Tua nhạc bằng Ruler
      rulerTimeline.addEventListener('click', (e) => {
        const rect = rulerTimeline.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const seekTime = ratio * duration;
        audioEl.currentTime = seekTime;
        updateTimeUI(seekTime);
      });

      // Nạp file nhạc lớn (300MB+)
      fileLoader.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          loadLargeAudioFile(e.target.files[0]);
        }
      });

      // Thêm Track
      btnAddTrack.addEventListener('click', () => {
        const newNum = tracks.length + 1;
        tracks.push({
          id: 'tr_' + Date.now(),
          name: `${String(newNum).padStart(2, '0')} - New Audio Track`,
          type: 'audio',
          volume: 0.85,
          muted: false,
          soloed: false,
          clips: []
        });
        renderTracksUI();
      });

      // Xóa Track và Mute LED
      trackHeadersList.addEventListener('click', (e) => {
        // Nút xóa track
        const delBtn = e.target.closest('.btn-del-track');
        if (delBtn) {
          const id = delBtn.dataset.id;
          tracks = tracks.filter(t => t.id !== id);
          renderTracksUI();
          return;
        }

        // Bấm đèn LED để Mute
        const led = e.target.closest('.track-led');
        if (led) {
          const id = led.dataset.id;
          const track = tracks.find(t => t.id === id);
          if (track) {
            track.muted = !track.muted;
            led.classList.toggle('off', track.muted);
            // Nếu là track Bass, điều chỉnh bộ lọc bassFilter
            if (track.type === 'bass' && bassFilter && audioCtx) {
              bassFilter.frequency.setTargetAtTime(track.muted ? 40 : 20000, audioCtx.currentTime, 0.05);
            }
          }
        }
      });

      // Chỉnh Volume từng track
      trackHeadersList.addEventListener('input', (e) => {
        if (e.target.classList.contains('track-vol')) {
          const id = e.target.dataset.id;
          const track = tracks.find(t => t.id === id);
          if (track) track.volume = parseFloat(e.target.value);
        }
      });

      // Export WAV cơ bản
      btnExport.addEventListener('click', () => {
        alert('Đã sẵn sàng kết xuất bản phối Arrangement ra file WAV chuẩn 16-Bit.');
      });

      setupDragAndDropClips();
      setupInlineRename();
    }
  </script>
</body>
